name: Publish

# Controls when the action will run.
on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # setuptools_scm requires the git clone to not be 'shallow'
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Install Dependencies
      run: uv sync

    - name: Build package
      run: uv build

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

    - name: Clean up prior staged artifacts in OSS Exit Gate repository
      run: |
        set -euo pipefail
        EXISTING_PKGS="$(gcloud artifacts packages list \
          --project=oss-exit-gate-prod \
          --location=us \
          --repository=chws-tool--pypi \
          --format='value(name)' 2>/dev/null || true)"
        for pkg in ${EXISTING_PKGS}; do
          gcloud artifacts packages delete "${pkg}" \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=chws-tool--pypi \
            --quiet || true
        done

    - name: Publish to OSS Exit Gate
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        set +x
        TOKEN="$(gcloud auth print-access-token)"
        uv publish \
          --publish-url https://us-python.pkg.dev/oss-exit-gate-prod/chws-tool--pypi/ \
          --username oauth2accesstoken \
          --password "${TOKEN}" \
          dist/*
        unset TOKEN
        printf '{"publish_all": true}\n' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/chws-tool/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
